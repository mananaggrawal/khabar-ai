app = "khabar-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[mounts]]
  source = "khabar_audio"
  destination = "/app/public/audio"

[[mounts]]
  source = "khabar_data"
  destination = "/app/.local-data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
