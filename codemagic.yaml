workflows:
  ios-release:
    name: Khabar iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default

    scripts:
      - name: Build iOS (no code signing)
        script: |
          cd khabar-flutter
          flutter pub get
          flutter create --platforms=ios .
          flutter build ios --release --no-codesign

    artifacts:
      - khabar-flutter/build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - manan.aggrawal@vegapay.tech
        notify:
          success: true
          failure: true
